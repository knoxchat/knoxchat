[workspace]
members = [
    "checkpoints",
    "autocomplete",
]
resolver = "2"

[workspace.package]
authors = ["Knox Team"]
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
dirs = "6.0.0"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"

# File system and async
tokio = { version = "1.52.3", features = ["full"] }
walkdir = "2.5.0"
ignore = "0.4.29"
notify = "8.2.0"

# Compression and encoding
flate2 = "1.1.9"
base64 = "0.22.1"
lz4_flex = "0.14.0"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.103"

# Node.js bindings - Updated to latest version
neon = { version = "1.1.1", default-features = false, features = ["napi-6"] }

# Additional dependencies
once_cell = "1.21.4"
parking_lot = "0.12.5"
dashmap = "6.2.1"
regex = "1.13.0"
rayon = "1.12.0"

# Logging
log = "0.4.33"
env_logger = "0.11.11"

# Security and encryption
ring = "0.17.14"
argon2 = "0.5.3"

# Monitoring and metrics
prometheus = "0.14.0"

# Configuration
config = "0.15.25"
toml = "1.1.3+spec-1.1.0"

# System utilities
num_cpus = "1.17.0"
lru = "0.18.1"

# Additional dependencies for production features
reqwest = { version = "0.13.4", features = ["json"] }
futures = "0.3.32"

# Tree-sitter for semantic analysis
tree-sitter = "0.26.11"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"

# Dev dependencies
tempfile = "3.27.0"
criterion = "0.8.2"

